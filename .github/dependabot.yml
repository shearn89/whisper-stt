# Grouped so a week's updates arrive as a few reviewable pull requests.
# Majors are excluded: they are done by hand, each in its own PR. Security
# updates are separate and ignore these rules.
#
# Note: this repo has no CI workflow, so nothing tests these PRs before merge.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      gomod:
        patterns: ["*"]
