[project]
name = "whisper-stt"
version = "0.1.0"
description = "Hold a hotkey, speak, release — text lands in your clipboard or active window."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Whisper (OpenAI's open-source model — runs locally, no API key)
    "openai-whisper>=20240930",
    # Audio capture
    "sounddevice>=0.4.7",
    "soundfile>=0.12.1",
    # Keyboard global hotkeys / listeners
    "pynput>=1.7.7",
    # Clipboard
    "pyperclip>=1.9.0",
    # numpy is a transitive dep of whisper but pin it for sounddevice compat
    "numpy>=1.26,<2.0",
]

[project.scripts]
whisper-stt = "whisper_stt.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/whisper_stt"]

